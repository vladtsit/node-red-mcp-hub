name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node_red_mcp_hub/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node_red_mcp_hub/gateway/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify release version consistency
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          grep -qx "version: ${VERSION}" ../config.yaml
          grep -qx "ARG BUILD_VERSION=${VERSION}" ../Dockerfile
          grep -q "\"${VERSION}\"" src/version.ts

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node_red_mcp_hub/gateway/package-lock.json
      - run: npm ci
        working-directory: node_red_mcp_hub/gateway
      - run: npm run build
        working-directory: node_red_mcp_hub/gateway
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  addon-images:
    runs-on: ubuntu-latest
    needs: gateway
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build app image
        run: |
          VERSION="$(node -p "require('./node_red_mcp_hub/gateway/package.json').version")"
          docker buildx build --platform linux/${{ matrix.arch }} --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="${VERSION}" -t node-red-mcp-hub:${{ matrix.arch }} -f node_red_mcp_hub/Dockerfile node_red_mcp_hub --load
      - name: Start app and check watchdog
        run: |
          trap 'docker rm --force node-red-mcp-hub-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name node-red-mcp-hub-smoke --publish 51844:51844 --mount type=bind,src="$GITHUB_WORKSPACE/node_red_mcp_hub/test/options.json",dst=/data/options.json,readonly node-red-mcp-hub:${{ matrix.arch }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:51844/healthz; then exit 0; fi
            sleep 1
          done
          docker logs node-red-mcp-hub-smoke
          exit 1
