name: Node-RED MCP Hub
slug: node_red_mcp_hub
description: Secure multi-server MCP gateway for managing Node-RED flows
version: 0.4.0
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  # 51844 references Morse's 1844 Washington–Baltimore telegraph demonstration.
  51844/tcp: 51844
ports_description:
  51844/tcp: MCP HTTP endpoint
watchdog: http://[HOST]:[PORT:51844]/healthz
options:
  # "auto" is replaced with a random 32-byte secret at first start and saved
  # back to the add-on configuration.
  mcp_path_secret: auto
  # A generated display value. The app overwrites it on every start.
  mcp_url: ''
  read_only: true
  redact_secrets: true
  backup_before_write: true
  backup_retain: 20
  backup_max_age_days: 0
  backup_max_size_mb: 0
  disabled_tools: ''
  home_assistant_node_red:
    enabled: false
    read_only: true
  servers: []
schema:
  mcp_path_secret: password
  mcp_url: str
  read_only: bool
  redact_secrets: bool
  backup_before_write: bool
  backup_retain: int(1,1000)
  backup_max_age_days: int(0,3650)
  backup_max_size_mb: int(0,10000)
  disabled_tools: str?
  home_assistant_node_red:
    enabled: bool
    username: str?
    password: password?
    url: url?
    read_only: bool?
  servers:
    - id: str
      name: str
      url: url
      auth_mode: list(credentials|bearer|basic|none)
      username: str?
      password: password?
      token: password?
      read_only: bool?
      disabled_tools: str?
hassio_api: true
# "manager" is required to list and read other apps (GET /addons, GET
# /addons/<slug>/info) for Node-RED auto-discovery; the "default" role can
# only access this app's own Supervisor data.
hassio_role: manager
